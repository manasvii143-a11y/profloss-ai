<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROFLOSSAI — Your AI Executive Team</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #0A0F1B;
      --bg-2: #0D1424;
      --panel: #111A2C;
      --panel-2: #152238;
      --border: #22314C;
      --border-soft: #1A2740;
      --text: #E9ECF3;
      --text-dim: #8C97AD;
      --text-faint: #5C6883;
      --gold: #C6A15B;
      --gold-soft: #8A7444;
      --emerald: #2FA37C;
      --rose: #B0503E;
      --amber: #C08A3E;
      --radius: 14px;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100vh;
    }

    body {
      background:
        radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(198, 161, 91, 0.06), transparent 60%),
        radial-gradient(ellipse 900px 500px at 100% 0%, rgba(47, 163, 124, 0.05), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      overflow-x: hidden;
    }

    ::selection {
      background: rgba(198, 161, 91, 0.25);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    input,
    select {
      font-family: inherit;
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
    }

    .eyebrow.dim {
      color: var(--text-faint);
    }

    #app {
      min-height: 100vh;
      position: relative;
    }

    .page {
      animation: pageIn 0.55s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001s !important;
        transition-duration: 0.001s !important;
      }
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 26px;
      border-radius: 9px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: linear-gradient(180deg, #D4B476, var(--gold));
      color: #181206;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px -8px rgba(198, 161, 91, 0.45);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-ghost:hover {
      border-color: var(--gold-soft);
      color: var(--gold);
    }

    .btn-arrow {
      transition: transform 0.25s ease;
    }

    .btn:hover .btn-arrow {
      transform: translateX(3px);
    }

    /* ===== Topbar & Navigation ===== */
    .topbar-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 56px;
      position: relative;
      z-index: 100;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .logo-icon {
      position: relative;
      width: 22px;
      height: 22px;
    }

    .logo-icon::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      left: 0;
      top: 2px;
      opacity: 0.8;
    }

    .logo-icon::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f355ff, #8000ff);
      right: 0;
      bottom: 2px;
      opacity: 0.8;
      mix-blend-mode: screen;
    }

    .logo-text {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .nav-pill {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(13, 20, 36, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 30px;
      padding: 4px 8px;
      backdrop-filter: blur(12px);
    }

    .nav-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      padding: 8px 16px;
      border-radius: 20px;
      transition: all 0.25s ease;
    }

    .nav-link.active,
    .nav-link:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
      font-weight: 500;
      transition: color 0.2s;
    }

    .lang-switch:hover {
      color: var(--text);
    }

    .chevron-down {
      width: 12px;
      height: 12px;
      transition: transform 0.2s;
    }

    .btn-topbar-start {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-topbar-start:hover {
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-1px);
    }

    /* ===== LANDING HERO & TRANSITIONS ===== */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 80px 0 100px 0;
      position: relative;
      text-align: center;
      box-sizing: border-box;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .hero-watermark {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(120px, 20vw, 320px);
      font-weight: 900;
      font-family: var(--sans);
      line-height: 1;
      color: rgba(255, 255, 255, 0.015);
      white-space: nowrap;
      pointer-events: none;
      z-index: 5;
      letter-spacing: -0.05em;
      user-select: none;
    }

    .hero-watermark .dot {
      color: rgba(211, 141, 255, 0.02);
    }

    .bg-glow-top {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: 130vh;
      height: 130vh;
      border-radius: 50%;
      border-bottom: 2px solid rgba(220, 80, 255, 0.8);
      box-shadow: 0 15px 50px rgba(220, 80, 255, 0.35), inset 0 -30px 100px rgba(220, 80, 255, 0.12);
      background: radial-gradient(circle at 50% 100%, rgba(20, 10, 35, 0.95), rgba(5, 8, 20, 1) 75%);
      transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bg-glow-bottom {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      width: 130vh;
      height: 130vh;
      border-radius: 50%;
      border-top: 2px solid rgba(0, 160, 255, 0.85);
      box-shadow: 0 -15px 50px rgba(0, 160, 255, 0.4), inset 0 30px 100px rgba(0, 160, 255, 0.15);
      background: radial-gradient(circle at 50% 0%, rgba(10, 20, 45, 0.95), rgba(5, 8, 20, 1) 75%);
      transition: all 1.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-content {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 680px;
      margin-top: 0;
      margin-bottom: 0;
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .google-style-logo {
      font-family: var(--sans);
      font-size: clamp(54px, 7vw, 90px);
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.03em;
      margin-bottom: 20px;
      margin-top: 10px;
      user-select: none;
      text-align: center;
      filter: drop-shadow(0 2px 10px rgba(255, 255, 255, 0.1));
    }

    .google-style-logo .dot-pink {
      background: linear-gradient(135deg, #d38dff, #ff8da1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    .hero-title {
      font-family: var(--sans);
      font-weight: 700;
      font-size: clamp(28px, 4vw, 48px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-top: 8px;
      margin-bottom: 12px;
    }

    .text-gradient {
      font-family: var(--serif);
      font-style: italic;
      font-weight: 500;
      background: linear-gradient(90deg, #d38dff 30%, #ff8da1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      filter: drop-shadow(0 0 30px rgba(220, 100, 255, 0.15));
    }

    .hero-subtitle {
      font-size: clamp(13px, 1.4vw, 15px);
      color: var(--text-dim);
      line-height: 1.4;
      max-width: 580px;
      margin: 0 auto 16px;
    }

    .hero-cta {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 16px;
    }

    .btn-start {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      background: rgba(13, 20, 36, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 35px;
      padding: 8px 8px 8px 26px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .btn-start:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
    }

    .arrow-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      color: #050814;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arrow-circle svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.5;
    }

    .btn-start:hover .arrow-circle {
      transform: rotate(45deg);
      background: #d3bdff;
    }

    .no-signup-note {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--text-faint);
    }

    .signal-strip {
      display: flex;
      gap: 30px;
      margin-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 10px;
      justify-content: center;
    }

    /* ===== SHOWCASE CONTAINER & FLOATING CARDS ===== */
    .showcase-container {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: stretch;
      width: 100%;
      flex: 1;
      max-width: 1350px;
      margin: 0 auto;
      z-index: 10;
      pointer-events: none;
      padding: 24px 0 10px;
      box-sizing: border-box;
    }

    .showcase-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      z-index: 10;
      box-sizing: border-box;
    }

    .showcase-left {
      width: 230px;
      align-items: flex-start;
      transform: translateX(-40px);
      padding-bottom: 20px;
      padding-top: 40px;
    }

    .showcase-center {
      flex: 1;
      max-width: 680px;
      align-items: center;
      position: relative;
      padding-bottom: 20px;
    }

    .showcase-right {
      width: 270px;
      align-items: flex-end;
      transform: translateX(40px);
      padding-bottom: 20px;
      padding-top: 40px;
    }

    .showcase-card {
      pointer-events: auto;
      background: rgba(10, 15, 30, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px) saturate(1.2);
      border-radius: 20px;
      padding: 16px 20px;
      color: #fff;
      box-shadow: 0 25px 50px -15px rgba(0, 0, 0, 0.5);
      text-align: left;
      transition: transform 0.5s ease-out, box-shadow 0.5s, opacity 0.8s, filter 0.8s;
    }

    .showcase-card:hover {
      box-shadow: 0 35px 65px -10px rgba(0, 0, 0, 0.7);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .widget-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    /* Central Glass balance card */
    .card-center {
      width: 380px;
      height: 195px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(135deg, rgba(30, 48, 80, 0.75) 0%, rgba(13, 24, 48, 0.8) 100%);
      padding: 22px 24px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 45px 85px -15px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transform: scale(0.95);
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card-balance-lbl {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
    }

    .card-balance-val {
      font-family: var(--sans);
      font-weight: 700;
      font-size: 38px;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0;
    }

    .btn-hide-val {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .btn-hide-val:hover {
      color: #ffffff;
    }

    .btn-hide-val svg {
      width: 20px;
      height: 20px;
    }

    .card-balance-details {
      display: flex;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 18px;
      gap: 32px;
    }

    .details-col {
      flex: 1;
    }

    .details-col .lbl {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 3px;
    }

    .details-col .val {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
    }

    .text-up {
      color: var(--emerald);
    }

    .text-down {
      color: #f38dff;
    }

    /* Surrounding floating widgets style overrides */
    .card-expenses {
      width: 210px;
      z-index: 20;
    }

    .expenses-ring-container {
      display: flex;
      justify-content: center;
      padding: 8px 0;
    }

    .expenses-ring {
      position: relative;
      width: 110px;
      height: 110px;
    }

    .expenses-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .expenses-val {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .expenses-val .v {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 600;
    }

    .expenses-val .l {
      font-size: 9px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    .card-saving {
      width: 190px;
      z-index: 21;
    }

    .saving-val {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 600;
      color: #e1b4ff;
      margin: 4px 0 2px;
    }

    .saving-updated {
      font-size: 11px;
      color: var(--text-faint);
    }

    .budget-toggle {
      width: 28px;
      height: 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      cursor: pointer;
    }

    .budget-toggle .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      top: 3px;
      right: 3px;
    }

    .card-budgets {
      width: 260px;
      z-index: 22;
    }

    .budget-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .budget-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .budget-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .budget-item-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .budget-item-info {
      flex: 1;
    }

    .budget-item-info .name {
      font-size: 12.5px;
      font-weight: 500;
    }

    .budget-item-info .progress {
      font-size: 11px;
      color: var(--text-faint);
      margin-top: 2px;
    }

    .budget-item-info .dim {
      color: var(--text-faint);
    }

    .budget-item-chart {
      position: relative;
      width: 34px;
      height: 34px;
    }

    .budget-item-chart .circular-chart {
      width: 100%;
      height: 100%;
    }

    .budget-item-chart .percentage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-family: var(--mono);
      font-weight: 500;
    }

    .budgets-footer {
      font-size: 11.5px;
      color: var(--gold);
      text-align: center;
      font-weight: 500;
      cursor: pointer;
    }

    .budgets-footer:hover {
      text-decoration: underline;
    }

    .card-goals {
      width: 230px;
      z-index: 23;
    }

    .goal-target {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .goal-name {
      font-size: 13.5px;
      font-weight: 600;
    }

    .goal-progress-text {
      font-size: 11.5px;
      color: var(--text-dim);
      margin-top: 1px;
    }

    .goal-progress-text .total {
      color: var(--text-faint);
    }

    .progressbar-track {
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      margin: 4px 0 2px;
    }

    .progressbar-fill {
      height: 100%;
      background: linear-gradient(90deg, #d38dff, #ff8da1);
      border-radius: 4px;
    }

    .goal-left {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--emerald);
      text-align: right;
    }

    .goal-btn-add {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
    }

    .card-emergency {
      width: 165px;
      z-index: 15;
    }

    .emergency-val {
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 600;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 4px;
    }

    .card-transactions {
      width: 220px;
      z-index: 16;
    }

    .card-transactions .see-all {
      font-size: 10.5px;
      color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }

    .card-transactions .see-all:hover {
      color: #fff;
    }

    .tx-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tx-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
    }

    .tx-icon {
      font-size: 14px;
    }

    .tx-name {
      flex: 1;
      font-weight: 500;
    }

    .tx-amount {
      font-family: var(--mono);
      font-weight: 600;
    }

    .tx-plus {
      color: var(--emerald);
    }

    .tx-minus {
      color: rgba(255, 255, 255, 0.8);
    }

    /* ===== STATE LOAD ANIMATIONS & FLOATING ===== */
    @keyframes float-1 {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      100% {
        transform: translateY(-12px) rotate(0.4deg);
      }
    }

    @keyframes float-2 {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      100% {
        transform: translateY(-16px) rotate(-0.5deg);
      }
    }

    @keyframes float-3 {
      0% {
        transform: translateY(0px) rotate(0deg);
      }

      100% {
        transform: translateY(-8px) rotate(0.8deg);
      }
    }

    /* State 0: absolute dark, minimal bottom glow */
    .hero.state-0 .bg-glow-top {
      transform: translateX(-50%) translateY(-100px) scale(0.6);
      opacity: 0;
    }

    .hero.state-0 .bg-glow-bottom {
      transform: translateX(-50%) translateY(100px) scale(0.6);
      opacity: 0.15;
    }

    .hero.state-0 .hero-content {
      opacity: 0;
      transform: translateY(40px);
    }

    .hero.state-0 .showcase-container {
      opacity: 0;
    }

    /* State 1: glows expand and meet */
    .hero.state-1 .bg-glow-top {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
      filter: blur(0px);
    }

    .hero.state-1 .bg-glow-bottom {
      transform: translateX(-50%) translateY(0) scale(1);
      opacity: 1;
      filter: blur(0px);
    }

    .hero.state-1 .hero-content {
      opacity: 0;
      transform: translateY(30px);
    }

    .hero.state-1 .showcase-container {
      opacity: 0;
    }

    /* State 2: Text fades in, central card is a blurred glass shape, others faint */
    .hero.state-2 .bg-glow-top,
    .hero.state-2 .bg-glow-bottom {
      opacity: 1;
    }

    .hero.state-2 .hero-content {
      opacity: 1;
      transform: translateY(0);
    }

    .hero.state-2 .hero-cta {
      opacity: 0;
      transform: scale(0.9);
    }

    .hero.state-2 .showcase-container {
      opacity: 1;
    }

    .hero.state-2 .card-center {
      opacity: 0.95;
      filter: blur(14px) saturate(1.8);
      background: rgba(13, 24, 48, 0.45);
      box-shadow: 0 0 30px rgba(0, 160, 255, 0.05);
    }

    .hero.state-2 .card-center * {
      opacity: 0 !important;
    }

    .hero.state-2 .card-widget {
      opacity: 0.12;
      filter: blur(7px);
      transform: scale(0.96) translateY(12px);
    }

    /* State 3: CTA appears, cards fully loaded & floating active */
    .hero.state-3 .hero-cta {
      opacity: 1;
      transform: scale(1);
    }

    .hero.state-3 .card-center {
      opacity: 1;
      filter: blur(0);
      transform: scale(1);
    }

    .hero.state-3 .card-widget {
      opacity: 1;
      filter: blur(0);
      transform: scale(1) translateY(0);
    }

    .hero.state-3 .card-expenses {
      animation: float-1 4.5s ease-in-out infinite alternate;
      animation-delay: 0.2s;
    }

    .hero.state-3 .card-saving {
      animation: float-2 5s ease-in-out infinite alternate;
      animation-delay: 0.6s;
    }

    .hero.state-3 .card-budgets {
      animation: float-3 6s ease-in-out infinite alternate;
      animation-delay: 0.4s;
    }

    .hero.state-3 .card-goals {
      animation: float-1 4.8s ease-in-out infinite alternate;
      animation-delay: 0.8s;
    }

    .hero.state-3 .card-emergency {
      animation: float-2 5.2s ease-in-out infinite alternate;
      animation-delay: 1.2s;
    }

    .hero.state-3 .card-transactions {
      animation: float-3 5.5s ease-in-out infinite alternate;
      animation-delay: 1.4s;
    }

    /* ===== Signal strip & extra helpers ===== */
    .signal-strip {
      display: flex;
      gap: 40px;
      margin-top: 36px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 22px;
      justify-content: center;
    }

    .signal-item {
      text-align: center;
    }

    .signal-item .num {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 600;
      color: var(--gold);
    }

    .signal-item .lbl {
      font-size: 12px;
      color: var(--text-faint);
      margin-top: 4px;
    }

    /* ===== Stepper / Setup / Upload ===== */
    .flow-shell {
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 0;
      margin-bottom: 48px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-faint);
    }

    .step .idx {
      font-family: var(--mono);
      font-size: 11px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .step.active .idx,
    .step.done .idx {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(198, 161, 91, 0.08);
    }

    .step .lbl {
      font-size: 13px;
      font-weight: 500;
    }

    .step.active .lbl,
    .step.done .lbl {
      color: var(--text);
    }

    .step-line {
      flex: 1;
      height: 1px;
      background: var(--border);
      margin: 0 14px;
      position: relative;
      top: 0;
    }

    .step-line.done {
      background: var(--gold-soft);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
    }

    .card h2 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card .sub {
      color: var(--text-dim);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 24px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      color: var(--text-dim);
      margin-bottom: 9px;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .field input[type=text],
    .field select {
      width: 100%;
      padding: 13px 15px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14.5px;
      transition: border-color 0.2s ease;
    }

    .field input[type=text]:focus,
    .field select:focus {
      outline: none;
      border-color: var(--gold-soft);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .goal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 6px;
    }

    .goal {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--bg-2);
      transition: all 0.2s ease;
      user-select: none;
    }

    .goal:hover {
      border-color: var(--border-soft);
    }

    .goal.checked {
      border-color: var(--gold-soft);
      background: rgba(198, 161, 91, 0.06);
    }

    .goal .box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .goal.checked .box {
      background: var(--gold);
      border-color: var(--gold);
    }

    .goal .box svg {
      width: 10px;
      height: 10px;
      opacity: 0;
    }

    .goal.checked .box svg {
      opacity: 1;
    }

    .goal .txt {
      font-size: 13.5px;
    }

    .flow-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 36px;
    }

    /* Upload zones */
    .upload-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 8px;
    }

    .dropzone {
      border: 1.5px dashed var(--border-soft);
      border-radius: 11px;
      padding: 22px;
      background: var(--bg-2);
      position: relative;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .dropzone:hover {
      border-color: var(--gold-soft);
    }

    .dropzone.filled {
      border-style: solid;
      border-color: var(--emerald);
      background: rgba(47, 163, 124, 0.05);
    }

    .dropzone .fname {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .dropzone .flabel {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13.5px;
      font-weight: 500;
    }

    .dropzone input {
      display: none;
    }

    .dz-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-2);
      flex-shrink: 0;
    }

    .dz-icon svg {
      width: 16px;
      height: 16px;
    }

    .dz-status {
      margin-left: auto;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-faint);
    }

    .dropzone.filled .dz-status {
      color: var(--emerald);
    }

    .sample-link {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      margin: 18px 0 4px;
    }

    .sample-link button {
      background: none;
      border: none;
      color: var(--gold);
      font-weight: 600;
      font-size: 13px;
    }

    .sample-link button:hover {
      text-decoration: underline;
    }

    /* ===== Analyzing ===== */
    .analyze-shell {
      max-width: 640px;
      margin: 0 auto;
      padding: 90px 24px;
    }

    .analyze-shell .heading {
      text-align: center;
      margin-bottom: 52px;
    }

    .analyze-shell h2 {
      font-family: var(--serif);
      font-size: 26px;
      font-weight: 600;
      margin-top: 14px;
    }

    .analyze-shell .sub {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 8px;
    }

    .agent-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 22px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--panel);
      margin-bottom: 12px;
      transition: all 0.35s ease;
    }

    .agent-row.active {
      border-color: var(--gold-soft);
    }

    .agent-row.done {
      border-color: rgba(47, 163, 124, 0.35);
    }

    .agent-row .a-icon {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: var(--panel-2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .agent-row .a-icon svg {
      width: 18px;
      height: 18px;
      color: var(--text-dim);
    }

    .agent-row.active .a-icon svg,
    .agent-row.done .a-icon svg {
      color: var(--gold);
    }

    .agent-row .a-body {
      flex: 1;
    }

    .agent-row .a-name {
      font-size: 14.5px;
      font-weight: 600;
    }

    .agent-row .a-status {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--text-faint);
      margin-top: 3px;
    }

    .agent-row.active .a-status {
      color: var(--gold);
    }

    .agent-row.done .a-status {
      color: var(--emerald);
    }

    .a-spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-soft);
      border-top-color: var(--gold);
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .a-check {
      width: 18px;
      height: 18px;
      color: var(--emerald);
      flex-shrink: 0;
    }

    .progress-line {
      height: 2px;
      background: var(--border-soft);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress-line .fill {
      height: 100%;
      width: 0%;
      background: var(--gold);
      transition: width 0.6s ease;
    }

    /* ===== Summary (CEO executive summary) ===== */
    .summary-shell {
      max-width: 920px;
      margin: 0 auto;
      padding: 56px 24px 100px;
    }

    .summary-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .summary-top h1 {
      font-family: var(--serif);
      font-size: 34px;
      font-weight: 600;
    }

    .health-block {
      display: flex;
      align-items: center;
      gap: 44px;
      margin: 28px 0 40px;
      flex-wrap: wrap;
    }

    .gauge-wrap {
      position: relative;
      width: 168px;
      height: 168px;
      flex-shrink: 0;
    }

    .gauge-wrap svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge-num {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gauge-num .n {
      font-family: var(--mono);
      font-size: 34px;
      font-weight: 600;
    }

    .gauge-num .l {
      font-size: 10.5px;
      color: var(--text-faint);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .status-cols {
      display: flex;
      gap: 56px;
      flex-wrap: wrap;
    }

    .status-col .k {
      font-size: 11.5px;
      color: var(--text-faint);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .status-col .v {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: var(--mono);
    }

    .pill-med {
      background: rgba(192, 138, 62, 0.12);
      color: var(--amber);
    }

    .pill-low {
      background: rgba(47, 163, 124, 0.12);
      color: var(--emerald);
    }

    .pill-high {
      background: rgba(176, 80, 62, 0.14);
      color: var(--rose);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .list-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .list-card h3 {
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .list-card ol {
      list-style: none;
    }

    .list-card li {
      display: flex;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border-soft);
      font-size: 14px;
      line-height: 1.5;
    }

    .list-card li:last-child {
      border-bottom: none;
    }

    .list-card .num {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-faint);
      flex-shrink: 0;
      padding-top: 1px;
    }

    .list-card.problems .num {
      color: var(--rose);
    }

    .list-card.opps .num {
      color: var(--emerald);
    }

    .rec-heading {
      font-size: 13px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin: 36px 0 18px;
    }

    .rec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .rec-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      transition: all 0.25s ease;
    }

    .rec-card.recommended {
      border-color: var(--gold-soft);
      background: linear-gradient(180deg, rgba(198, 161, 91, 0.05), var(--panel));
    }

    .rec-card .badge {
      position: absolute;
      top: -11px;
      right: 18px;
      background: var(--gold);
      color: #181206;
      font-size: 10px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      font-family: var(--mono);
      letter-spacing: 0.04em;
    }

    .rec-card .r-title {
      font-family: var(--serif);
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .rec-card .r-desc {
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 20px;
      min-height: 36px;
    }

    .r-stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .r-stat .k {
      color: var(--text-faint);
    }

    .r-stat .v {
      font-family: var(--mono);
      font-weight: 600;
    }

    .bar-track {
      height: 5px;
      background: var(--bg-2);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 1s cubic-bezier(.16, 1, .3, 1);
    }

    .bar-fill.success {
      background: var(--emerald);
    }

    .bar-fill.risk {
      background: var(--rose);
    }

    .summary-actions {
      display: flex;
      justify-content: center;
      margin-top: 48px;
    }

    /* ===== App shell (dashboard) ===== */
    .shell {
      display: grid;
      grid-template-columns: 248px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--bg-2);
      border-right: 1px solid var(--border-soft);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar .wordmark {
      padding: 0 10px;
      margin-bottom: 6px;
    }

    .sidebar .company-tag {
      padding: 0 10px;
      font-size: 12px;
      color: var(--text-faint);
      margin-bottom: 30px;
      font-family: var(--mono);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      border-radius: 8px;
      color: var(--text-dim);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 3px;
      transition: all 0.2s ease;
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .nav-item:hover {
      background: var(--panel);
      color: var(--text);
    }

    .nav-item.active {
      background: var(--panel-2);
      color: var(--gold);
    }

    .nav-item.active svg {
      color: var(--gold);
    }

    .sidebar-foot {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
    }

    .sidebar-foot .restart {
      font-size: 12.5px;
      color: var(--text-faint);
    }

    .sidebar-foot .restart:hover {
      color: var(--rose);
    }

    .main {
      padding: 40px 48px 80px;
      max-width: 1180px;
    }

    .main-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 32px;
    }

    .main-head h1 {
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 600;
    }

    .main-head .sub {
      color: var(--text-dim);
      font-size: 13.5px;
      margin-top: 6px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
    }

    .kpi-card .k {
      font-size: 11.5px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
    }

    .kpi-card .v {
      font-family: var(--mono);
      font-size: 24px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .trend-arrow {
      font-size: 15px;
    }

    .trend-up {
      color: var(--emerald);
    }

    .trend-down {
      color: var(--rose);
    }

    .trend-flat {
      color: var(--amber);
    }

    .kpi-card svg.spark {
      margin-top: 12px;
      width: 100%;
      height: 32px;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
    }

    .panel-card h3 {
      font-size: 12.5px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 18px;
    }

    .op-threat {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .ot-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 16px;
      border-radius: 10px;
      background: var(--bg-2);
      border: 1px solid var(--border-soft);
    }

    .ot-row .tag {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 5px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .tag-opp {
      background: rgba(47, 163, 124, 0.12);
      color: var(--emerald);
    }

    .tag-threat {
      background: rgba(176, 80, 62, 0.14);
      color: var(--rose);
    }

    .ot-row .txt {
      font-size: 13.5px;
      line-height: 1.5;
    }

    .meeting-cta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 26px;
      background: linear-gradient(90deg, rgba(198, 161, 91, 0.07), transparent);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
      margin-top: 4px;
    }

    .meeting-cta .l {
      font-size: 14px;
    }

    .meeting-cta .l b {
      font-family: var(--serif);
      font-size: 16.5px;
      font-weight: 600;
      display: block;
      margin-bottom: 3px;
    }

    /* Executive meeting page */
    .meeting-shell {
      max-width: 760px;
    }

    .transcript {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .t-entry {
      display: flex;
      gap: 20px;
      padding: 22px 0;
      border-bottom: 1px solid var(--border-soft);
      opacity: 0;
      animation: fadeSlide 0.5s ease forwards;
    }

    .t-entry:last-child {
      border-bottom: none;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateX(-8px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .t-entry .nameplate {
      width: 150px;
      flex-shrink: 0;
    }

    .t-entry .nameplate .role {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      padding: 5px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      display: inline-block;
    }

    .t-entry .line {
      font-size: 15px;
      line-height: 1.6;
      padding-top: 2px;
    }

    .t-entry.ceo {
      background: linear-gradient(90deg, rgba(198, 161, 91, 0.06), transparent);
      border-left: 2px solid var(--gold);
      padding-left: 18px;
      margin-left: -20px;
    }

    .t-entry.ceo .line {
      font-family: var(--serif);
      font-size: 16.5px;
      font-weight: 500;
    }

    /* Agent reports page */
    .report-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .report-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
    }

    .report-card .rc-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .report-card .rc-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--panel-2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .report-card .rc-icon svg {
      width: 16px;
      height: 16px;
    }

    .report-card .rc-title {
      font-weight: 600;
      font-size: 14.5px;
    }

    .report-card .rc-tag {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-faint);
    }

    .report-card ul {
      list-style: none;
      margin-top: 4px;
    }

    .report-card li {
      font-size: 13px;
      color: var(--text-dim);
      padding: 8px 0;
      border-top: 1px solid var(--border-soft);
      line-height: 1.5;
    }

    .report-card li:first-child {
      border-top: none;
    }

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .data-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .data-row .name {
      font-family: var(--mono);
      font-size: 13px;
      flex: 1;
    }

    .data-row .stat {
      font-size: 11.5px;
      color: var(--emerald);
      font-family: var(--mono);
    }

    .data-row .stat.missing {
      color: var(--text-faint);
    }

    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-2);
      border: 1px solid var(--border);
      padding: 14px 22px;
      border-radius: 9px;
      font-size: 13px;
      color: var(--rose);
      box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6);
      z-index: 50;
    }

    /* ===== NEW SHELL CSS ===== */
    .sidebar { width: 220px; min-width: 220px; background: var(--bg-2); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; overflow-y: auto; }
    .wordmark { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; padding: 22px 20px 4px; color: var(--text); }
    .wordmark .dot { color: var(--gold); }
    .company-tag { font-family: var(--mono); font-size: 10px; color: var(--text-faint); padding: 0 20px 18px; border-bottom: 1px solid var(--border); }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; margin: 2px 8px; cursor: pointer; font-size: 13.5px; color: var(--text-dim); transition: all 0.2s; }
    .nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
    .nav-item:hover { background: var(--panel); color: var(--text); }
    .nav-item.active { background: var(--panel-2); color: var(--text); border-left: 2px solid var(--gold); }
    .nav-section-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); padding: 12px 20px 4px; margin-top: 4px; }
    .nav-accordion-header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; margin: 2px 8px; cursor: pointer; font-size: 13.5px; color: var(--text-dim); transition: all 0.2s; justify-content: space-between; }
    .nav-accordion-header:hover { background: var(--panel); color: var(--text); }
    .nav-accordion-header.open { color: var(--text); }
    .nav-accordion-left { display: flex; align-items: center; gap: 10px; }
    .nav-accordion-left svg { width: 16px; height: 16px; }
    .nav-chevron { width: 14px !important; height: 14px !important; transition: transform 0.2s; }
    .nav-chevron.open { transform: rotate(180deg); }
    .nav-children { padding-left: 12px; display: none; }
    .nav-children.open { display: block; }
    .nav-child { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 7px; margin: 1px 8px; cursor: pointer; font-size: 12.5px; color: var(--text-faint); transition: all 0.2s; }
    .nav-child:hover { color: var(--text); background: var(--panel); }
    .nav-child.active { color: var(--text); background: var(--panel-2); border-left: 2px solid var(--gold); }
    .nav-child-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .nav-child.active .nav-child-dot { background: var(--gold); }
    .sidebar-foot { margin-top: auto; padding: 12px 0 16px; border-top: 1px solid var(--border); }

    /* Main content */
    .main { flex: 1; overflow-y: auto; background: var(--bg); padding: 36px 40px; }
    .main-head { margin-bottom: 28px; }
    .main-head h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .main-head .sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

    /* Health score grid */
    .health-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 28px; }
    .health-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; text-align: center; }
    .health-card.overall { border-color: var(--gold); background: linear-gradient(135deg, rgba(198,161,91,0.08), var(--panel)); }
    .health-label { font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); margin-bottom: 10px; }
    .health-score { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .health-score.good { color: var(--emerald); }
    .health-score.warn { color: var(--amber); }
    .health-score.bad { color: var(--rose); }
    .health-score.gold { color: var(--gold); }
    .health-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 10px; }
    .health-bar-fill { height: 100%; border-radius: 2px; }

    /* Executive summary header */
    .exec-header { background: linear-gradient(135deg, rgba(198,161,91,0.06), var(--panel)); border: 1px solid rgba(198,161,91,0.2); border-radius: 14px; padding: 22px 28px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .exec-header-left { display: flex; flex-direction: column; gap: 6px; }
    .exec-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(198,161,91,0.12); border: 1px solid rgba(198,161,91,0.25); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-family: var(--mono); color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; width: fit-content; }
    .exec-title { font-size: 18px; font-weight: 700; color: var(--text); }
    .exec-status-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .exec-stat { display: flex; flex-direction: column; gap: 3px; }
    .exec-stat-label { font-size: 10.5px; font-family: var(--mono); color: var(--text-faint); text-transform: uppercase; }
    .exec-stat-value { font-size: 14px; font-weight: 600; color: var(--text); }

    /* Severity table */
    .severity-table { width: 100%; border-collapse: collapse; }
    .severity-table th { font-size: 11px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .severity-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border-soft); }
    .severity-table tr:last-child td { border-bottom: none; }
    .sev-badge { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 10.5px; font-family: var(--mono); font-weight: 600; }
    .sev-critical { background: rgba(255,80,80,0.15); color: #ff6b6b; }
    .sev-high { background: rgba(255,160,60,0.15); color: var(--amber); }
    .sev-medium { background: rgba(198,161,91,0.15); color: var(--gold); }
    .sev-low { background: rgba(100,200,120,0.12); color: var(--emerald); }

    /* Solution cards */
    .solution-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .solution-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; position: relative; transition: border-color 0.2s; }
    .solution-card:hover { border-color: var(--gold); }
    .solution-card.ceo-pick { border-color: rgba(198,161,91,0.4); background: linear-gradient(135deg, rgba(198,161,91,0.06), var(--panel)); }
    .ceo-pick-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--gold); color: #050814; font-size: 9.5px; font-weight: 700; font-family: var(--mono); padding: 3px 8px; border-radius: 8px; margin-bottom: 10px; }
    .solution-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .solution-desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; margin-bottom: 12px; }
    .solution-meta { display: flex; gap: 16px; }
    .solution-meta-item { display: flex; flex-direction: column; gap: 2px; }
    .solution-meta-label { font-size: 10px; font-family: var(--mono); color: var(--text-faint); text-transform: uppercase; }
    .solution-meta-value { font-size: 13px; font-weight: 600; color: var(--emerald); }
    .solution-meta-value.warn { color: var(--amber); }
    .solution-meta-value.time { color: var(--text-dim); }

    /* Root cause chain */
    .root-cause-chain { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 20px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
    .rc-node { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; font-size: 13.5px; font-weight: 500; color: var(--text); }
    .rc-root { border-color: var(--rose); background: rgba(255,80,80,0.06); color: var(--rose); font-weight: 700; }
    .rc-arrow { font-size: 18px; color: var(--text-faint); padding: 4px 0; padding-left: 20px; }
    .rc-why { font-size: 10.5px; font-family: var(--mono); color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; padding-left: 18px; }

    /* Opportunity cards */
    .opp-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .opp-card-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; cursor: pointer; transition: background 0.2s; }
    .opp-card-header:hover { background: var(--panel-2); }
    .opp-card-title { font-size: 14px; font-weight: 600; }
    .opp-card-subtitle { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
    .opp-card-meta { display: flex; gap: 20px; align-items: center; }
    .opp-metric { text-align: right; }
    .opp-metric-val { font-size: 16px; font-weight: 700; color: var(--emerald); }
    .opp-metric-label { font-size: 10px; font-family: var(--mono); color: var(--text-faint); }
    .opp-expand-btn { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-dim); transition: all 0.2s; font-size: 16px; line-height: 1; }
    .opp-card-body { display: none; padding: 0 20px 20px; border-top: 1px solid var(--border-soft); }
    .opp-card.open .opp-card-body { display: block; }
    .opp-card.open .opp-expand-btn { transform: rotate(45deg); background: var(--gold); border-color: var(--gold); color: #050814; }
    .exec-decisions { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .exec-dec-item { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border-soft); }
    .exec-dec-item:last-child { border-bottom: none; }
    .dec-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .dec-text { flex: 1; color: var(--text); }
    .dec-reason { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }

    /* Priority matrix */
    .priority-table { width: 100%; border-collapse: collapse; }
    .priority-table td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--border-soft); }
    .priority-table tr:last-child td { border-bottom: none; }
    .priority-name { font-weight: 500; }
    .star-rating { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
    .star-rating .dim { color: var(--border); }

    /* CEO Letter */
    .ceo-letter { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 28px 32px; position: relative; overflow: hidden; }
    .ceo-letter::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--gold), rgba(198,161,91,0)); }
    .ceo-letter-greeting { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; }
    .ceo-letter-body { font-size: 14px; color: var(--text-dim); line-height: 1.75; }
    .ceo-letter-sig { margin-top: 24px; display: flex; flex-direction: column; gap: 2px; }
    .ceo-letter-sig-name { font-weight: 700; font-size: 14px; }
    .ceo-letter-sig-title { font-size: 12px; font-family: var(--mono); color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; }

    /* CEO Chat */
    .chat-shell { display: flex; flex-direction: column; height: calc(100vh - 72px); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 0 0 24px; display: flex; flex-direction: column; gap: 16px; }
    .chat-msg { display: flex; gap: 12px; animation: fadeUp 0.35s ease both; }
    .chat-msg.user { flex-direction: row-reverse; }
    .chat-avatar { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; background: var(--panel-2); border: 1px solid var(--border); }
    .chat-avatar.ceo { background: rgba(198,161,91,0.15); border-color: rgba(198,161,91,0.3); color: var(--gold); font-size: 12px; }
    .chat-avatar.user-av { background: var(--panel-2); color: var(--text); font-size: 13px; }
    .chat-bubble { max-width: 70%; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; font-size: 13.5px; line-height: 1.6; }
    .chat-msg.user .chat-bubble { background: var(--panel-2); border-color: var(--border); }
    .chat-disclaimer { font-size: 10.5px; color: var(--text-faint); font-style: italic; margin-top: 6px; font-family: var(--mono); }
    .chat-input-row { display: flex; gap: 10px; padding-top: 16px; border-top: 1px solid var(--border); }
    .chat-input { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 14px; color: var(--text); font-family: var(--sans); resize: none; outline: none; transition: border-color 0.2s; }
    .chat-input:focus { border-color: var(--gold); }
    .chat-send-btn { background: var(--gold); color: #050814; border: none; border-radius: 10px; padding: 12px 18px; font-weight: 700; font-size: 13px; cursor: pointer; transition: opacity 0.2s; }
    .chat-send-btn:hover { opacity: 0.85; }
    .chat-typing { display: flex; align-items: center; gap: 4px; padding: 10px 14px; }
    .typing-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); animation: blink 1.4s infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100%{opacity:0.3} 40%{opacity:1} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

    /* Agent dashboards */
    .agent-dashboard-header { display: flex; align-items: center; gap: 14px; padding: 20px 24px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 24px; }
    .agent-avatar { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .agent-avatar.cfo { background: rgba(47,163,124,0.15); }
    .agent-avatar.analyst { background: rgba(125,155,230,0.15); }
    .agent-avatar.social { background: rgba(211,141,255,0.15); }
    .agent-avatar.risk { background: rgba(255,120,80,0.15); }
    .agent-name { font-size: 16px; font-weight: 700; }
    .agent-role { font-size: 11.5px; font-family: var(--mono); color: var(--text-faint); margin-top: 2px; }
    .agent-score { margin-left: auto; text-align: right; }
    .agent-score-val { font-size: 28px; font-weight: 700; color: var(--emerald); }
    .agent-score-label { font-size: 11px; font-family: var(--mono); color: var(--text-faint); }
    .agent-snapshot { font-size: 13.5px; color: var(--text-dim); margin-left: 0; flex: 1; line-height: 1.5; }

    /* Section blocks */
    .section-block { margin-bottom: 28px; }
    .section-title { font-size: 13px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .metric-tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
    .metric-tile-label { font-size: 11px; font-family: var(--mono); color: var(--text-faint); text-transform: uppercase; margin-bottom: 6px; }
    .metric-tile-value { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.01em; }
    .metric-tile-sub { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
    .metric-tile-value.green { color: var(--emerald); }
    .metric-tile-value.amber { color: var(--amber); }
    .metric-tile-value.red { color: var(--rose); }

    /* Risk heatmap */
    .risk-heatmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .heat-cell { border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
    .heat-cell.low { background: rgba(47,163,124,0.12); border: 1px solid rgba(47,163,124,0.2); }
    .heat-cell.medium { background: rgba(198,161,91,0.12); border: 1px solid rgba(198,161,91,0.25); }
    .heat-cell.high { background: rgba(255,160,60,0.12); border: 1px solid rgba(255,160,60,0.2); }
    .heat-cell.critical { background: rgba(255,80,80,0.12); border: 1px solid rgba(255,80,80,0.2); }
    .heat-label { font-size: 11.5px; font-weight: 600; color: var(--text); }
    .heat-level { font-size: 10.5px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
    .heat-cell.low .heat-level { color: var(--emerald); }
    .heat-cell.medium .heat-level { color: var(--gold); }

        return `<div class="step ${cls}"><div class="idx">${i + 1}</div><div class="lbl">${s}</div></div>${line}`;
      }).join('') + `</div>`;

    function setAgentState(key, phase, verb) {
      const row = document.getElementById(`row-${key}`);
      if (!row) return;
      const status = document.getElementById(`status-${key}`);
      const marker = document.getElementById(`marker-${key}`);
      const fill = document.getElementById(`fill-${key}`);
      if (phase === 'active') {
        row.classList.add('active');
        status.textContent = verb || 'Analyzing…';
        marker.innerHTML = `<div class="a-spinner"></div>`;
        fill.style.width = '55%';
      } else if (phase === 'done') {
        row.classList.remove('active');
        row.classList.add('done');
        status.textContent = 'Complete';
        marker.innerHTML = ICONS.check.replace('<svg', '<svg class="a-check"');
        fill.style.width = '100%';
      }
    }

        const [a, b, c] = await Promise.all([runDataAnalyst(), runCFO(), runSocial()]);

        setAgentState('dataAnalyst', 'done'); setAgentState('cfo', 'done'); setAgentState('social', 'done');

        setAgentState('risk', 'active', AGENT_SEQUENCE[3].verb);
        const d = await runRisk(a, b, c);
        state.reports.risk = d;

        setAgentState('ceo', 'active', AGENT_SEQUENCE[4].verb);
        const e = await runCEO(a, b, c, d);

        state.page = 'shell';

        if (!state.reports.ceo) state.reports.ceo = fallback('ceo');
        state.page = 'shell';
        state.activeShellTab = 'overview';
        render();
      }
    }

      const color = value >= 70 ? 'var(--emerald)' : value >= 45 ? 'var(--amber)' : 'var(--rose)';
      return `<svg viewBox="0 0 168 168">
    <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--border)" stroke-width="10"/>
    <circle id="gauge-fg" cx="84" cy="84" r="${r}" fill="none" stroke="${color}" stroke-width="10"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" />
  </svg>`;
    }

      const cls = u === 'Low' ? 'pill-low' : u === 'High' ? 'pill-high' : 'pill-med';

    }

      return '<span class="trend-arrow trend-flat">→</span>';

    function sparkline(points, color) {
      const w=140,h=32,max=Math.max(...points),min=Math.min(...points);
      const norm=points.map((p,i)=>`${(i/(points.length-1))*w},${h-((p-min)/((max-min)||1))*h}`).join(' ');
      return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${norm}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }

    function renderAgentRisk() {
      const r = state.reports.risk;
      const lvl = r.riskLevel||'Medium';
      const needlePos = {Low:15,Medium:42,High:70,Critical:90}[lvl]||42;
      const heatData = r.heatMap || [

      ];
      const opRisks = r.operationalRisks || [];
      const mktRisks = r.marketRisks || [];
      const custRisks = r.customerRisks || [];

      function sevClass(sev) {
        const s = (sev||'').toLowerCase();
        if (s==='critical') return 'sev-critical';
        if (s==='high') return 'sev-high';
        if (s==='medium') return 'sev-medium';
        return 'sev-low';
      }
      function sevLabel(sev) {
        const s = (sev||'').toLowerCase();
        return s.charAt(0).toUpperCase() + s.slice(1) || 'Low';
      }

      function riskRows(items) {
        if (!items || items.length === 0) return '<div style="color:var(--text-faint);font-size:13px;padding:12px">No risks identified.</div>';
        return items.map(item => `<div class="risk-row">
          <span class="risk-icon">${item.icon||'⚠️'}</span>
          <div class="risk-info">
            <div class="risk-name">${item.name||''}</div>
            <div class="risk-desc">${item.desc||''}</div>
            <div class="risk-timeline">⏱ ${item.timeline||'Ongoing'}</div>
          </div>
          <span class="sev-badge ${sevClass(item.severity)}">${sevLabel(item.severity)}</span>
        </div>`).join('');

          {
            keys: ['health','score','overall','status','summary'],
            ans: `Business health: <strong>${ceo.businessHealth}/100</strong> · Status: <strong>${ceo.status}</strong> · Urgency: <strong>${ceo.urgency}</strong>. Top problems: ${ceo.biggestProblems?.join('; ')||'revenue concentration, churn, margin compression'}. Biggest opportunities: ${ceo.biggestOpportunities?.join('; ')||'educational content, Product B growth, returning customer spend'}.`
          },
          {
            keys: ['product','line','category','sku'],
            ans: `${da.topProducts?.map(p=>`${p.name}: ${p.sharePct}% share`).join(' | ')||'Product A leads at 61% share'}. ${da.keyFindings?.[0]||'Revenue is concentrated in one product — diversification is critical.'}`
          },
          {
            keys: ['opportunity','grow','growth','expand','invest'],
            ans: `Our clearest opportunities: ${ceo.biggestOpportunities?.join(', ')||'educational content, Product B growth, returning customer spend'}. I would prioritize ${ceo.biggestOpportunities?.[0]||'educational content strategy'} first — it has the highest near-term ROI with minimal capital outlay.`
          },
          {
            keys: ['cash','cash flow','liquidity','burn'],
            ans: `Cash flow status is <strong>${cfo.cashFlowStatus}</strong>. Total expenses recorded: $${(cfo.expenses||0).toLocaleString()}. ${cfo.keyFindings?.[2]||'Budget allocation currently favors acquisition over retention.'}`
          }
        ];

        let reply = '';
        for (const p of predefined) {
          if (p.keys.some(k => q.includes(k))) { reply = p.ans; break; }
        }
        if (!reply) {
          reply = `Good question. Based on all four reports, the business is in <strong>${ceo.status||'Growing'}</strong> mode with a health score of <strong>${ceo.businessHealth||82}/100</strong>. The single biggest lever right now is <strong>${ceo.finalRecommendationLabel||'customer retention'}</strong> — everything else flows from that decision. What specific area would you like to dig into?`;
        }

        state.chatMessages.push({ role:'ceo', content: reply });
        typingEl.remove();
        const ceoBubble = document.createElement('div');
        ceoBubble.className = 'chat-msg';
        ceoBubble.innerHTML = `<div class="chat-avatar ceo">CEO</div><div><div class="chat-bubble">${reply}</div><div class="chat-disclaimer">⚠️ AI agents can make mistakes. Always verify key decisions with your team.</div></div>`;
        msgs_el.appendChild(ceoBubble);
        msgs_el.scrollTop = msgs_el.scrollHeight;
        sendBtn.disabled = false;
        input.focus();
      }

      sendBtn.addEventListener('click', sendMessage);
      input.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
      return node;
    }

    /* ================================================================
       DATA SOURCES (unchanged)
    ================================================================ */
    function renderSources() {
      const files = state.files;
      const meta = [
        { key:'financials',   label:'financials.csv' },
        { key:'customers',    label:'customers.csv' },
        { key:'transactions', label:'transactions.csv' },
        { key:'social',       label:'social_media.csv' },
      ];
      const node = el(`<div>
  <div class="main-head"><div><h1>Data Sources</h1><div class="sub">${state.usingSample?'Currently analyzing sample company data.':'Files used in this analysis.'}</div></div></div>
  <div class="data-list">
    ${meta.map(m=>`<div class="data-row">
      <div class="dz-icon">${ICONS.doc}</div>
      <div class="name">${m.label}</div>
      <div class="stat ${files[m.key]?'':'missing'}">${files[m.key]?(Math.round(files[m.key].length/1024*10)/10+' KB loaded'):'Not provided'}</div>
    </div>`).join('')}
  </div>
</div>`);
      return node;
    }

    /* ============================= INIT ============================= */
    render();
  </script>
</body>

</html>
